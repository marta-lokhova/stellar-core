name: Optimized CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
      - prod
      - testnet
      - acceptance-test-pass

jobs:
  # Static analysis checks - run in parallel with builds
  fmt:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - run: rustup component add rustfmt
    - run: rustup update
    - run: cargo fmt --all --check

  cargo-deny:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@8d73959fce1cdc8989f23fdf03bec6ae6a6576ef
      with:
        command: check ${{ matrix.checks }}
        # leave arguments empty so we don't test --all-features
        # which will see conflicting env versions
        arguments:

  rust-check-git-rev-deps:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: stellar/actions/rust-check-git-rev-deps@main

  # Build phase - compiles code for each toolchain/protocol combination
  build:
    runs-on: ubuntu-22.04
    env:
      CACHED_DEPS_PATHS: |
        ~/.ccache
        ~/.cargo
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ "gcc", "clang"]
        protocol: ["current", "next"]
    steps:
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28

      # Try to restore dependency cache
      - name: Restore Dependency Cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHED_DEPS_PATHS }}
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-deps-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-deps-

      - uses: actions/checkout@v4
        with:
           fetch-depth: 200
           submodules: true

      - name: Generate Source Files Hash
        id: hash
        run: |
          echo "hash=$(find src -type f -name "*.cpp" -o -name "*.h" -o -name "*.c" | sort | xargs sha256sum | sha256sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          echo "rust_hash=$(find src/rust -type f -name "*.rs" | sort | xargs sha256sum | sha256sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      # Try to restore build cache based on source code hash
      - name: Restore Build Cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target
            .libs
            src/.libs
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-build-${{ steps.hash.outputs.hash }}-${{ steps.hash.outputs.rust_hash }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-build-

      - name: Install core packages
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends apt-utils dialog git iproute2 procps lsb-release
      
      - name: Install toolchain
        run: |
          sudo apt-get -y install libstdc++-10-dev clang-format-12 ccache lldb
          if test "${{ matrix.toolchain }}" = "gcc" ; then
            sudo apt-get -y install cpp-10 gcc-10 g++-10
          else
            sudo apt-get -y install clang-12 llvm-12
          fi
      
      - name: Install Rust components
        run: rustup component add rustfmt
      
      - name: Install Cargo tools
        run: |
          cargo install --locked cargo-cache --version 0.8.3
          cargo install --locked cargo-sweep --version 0.7.0
      
      - name: Install dependencies
        run: sudo apt-get -y install postgresql git build-essential pkg-config autoconf automake libtool bison flex libpq-dev parallel libunwind-dev sed perl

      - name: Setup build environment
        run: |
          mkdir -p bin
          export PATH=`pwd`/bin:$PATH
          if test "${{ matrix.toolchain }}" = "clang" ; then
            ln -s `which clang-12` bin/clang
            ln -s `which clang++-12` bin/clang++
            ln -s `which llvm-symbolizer-12` bin/llvm-symbolizer
          else
            ln -s `which gcc-10` bin/gcc
            ln -s `which g++-10` bin/g++
          fi
          
          # Configure ccache
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=9
          export CCACHE_MAXSIZE=500M
          export CCACHE_CPP2=true
          
          ccache -p
          ccache -s

      - name: Build stellar-core
        env:
          CFLAGS: "-O2 -g1 -fno-omit-frame-pointer -fsanitize-address-use-after-scope -fno-common"
          CXXFLAGS: "-w -O2 -g1 -fno-omit-frame-pointer -fsanitize-address-use-after-scope -fno-common"
          ASAN_OPTIONS: "quarantine_size_mb=100:malloc_context_size=4:detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:log_path=stdout"
        run: |
          if test "${{ matrix.toolchain }}" = "gcc" ; then
            export CC='gcc'
            export CXX='g++'
          else
            export CC='clang'
            export CXX='clang++'
          fi
          
          NPROCS=$(getconf _NPROCESSORS_ONLN)
          echo "Building with $CC and $CXX using $NPROCS processors"
          
          PROTOCOL_CONFIG=""
          if [[ "${{ matrix.protocol }}" == "next" ]]; then
            PROTOCOL_CONFIG="--enable-next-protocol-version-unsafe-for-production"
          fi
          
          config_flags="--enable-asan --enable-extrachecks --enable-ccache --enable-sdfprefs ${PROTOCOL_CONFIG}"
          
          # Build only, don't run tests
          ./autogen.sh
          ./configure $config_flags
          make format
          make -j$(($NPROCS + 1))
          
          # Cache management
          ccache -s
          cargo cache trim --limit 100M
          cargo sweep --maxsize 500MB

      # Save dependency cache for future runs
      - name: Save Dependency Cache
        if: github.ref_name == 'master'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHED_DEPS_PATHS }}
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-deps-${{ github.sha }}

      # Save build cache based on source code hash for future runs
      - name: Save Build Cache
        if: github.ref_name == 'master'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            .libs
            src/.libs
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.protocol }}-build-${{ steps.hash.outputs.hash }}-${{ steps.hash.outputs.rust_hash }}

      # Create artifact with build outputs for test jobs
      - name: Package Build Artifacts
        run: |
          tar -czf stellar-core-build.tar.gz \
            src/stellar-core \
            src/test/test_globals.cfg \
            src/test/test.cfg \
            lib \
            src/.libs \
            target

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-core-${{ matrix.toolchain }}-${{ matrix.protocol }}
          path: stellar-core-build.tar.gz
          retention-days: 1

  # Test phase - runs various test combinations using build artifacts
  test:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ "gcc", "clang"]
        protocol: ["current", "next"]
        scenario: ["regular", "tx-meta"]
    steps:
      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28
    
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends postgresql libpq-dev parallel
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: stellar-core-${{ matrix.toolchain }}-${{ matrix.protocol }}
          path: .

      - name: Extract Build Artifacts
        run: tar -xzf stellar-core-build.tar.gz

      - name: Setup PostgreSQL
        run: |
          export PGUSER=postgres
          psql -c "create database test;"
          
          NPROCS=$(getconf _NPROCESSORS_ONLN)
          for j in $(seq 0 $((NPROCS-1))); do
            base_instance=$((j*50))
            for i in $(seq $base_instance $((base_instance+15))); do
              psql -c "create database test$i;"
            done
          done

      - name: Run Tests
        env:
          ASAN_OPTIONS: "quarantine_size_mb=100:malloc_context_size=4:detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:log_path=stdout"
        run: |
          NPROCS=$(getconf _NPROCESSORS_ONLN)
          
          if test "${{ matrix.toolchain }}" = "clang"; then
            RUN_PARTITIONS=$(seq 0 $((NPROCS-1)))
          else
            RUN_PARTITIONS=$(seq $NPROCS $((2*NPROCS-1)))
          fi
          
          export ALL_VERSIONS=1
          export NUM_PARTITIONS=$((NPROCS*2))
          export RUN_PARTITIONS
          
          if [[ "${{ matrix.scenario }}" == "tx-meta" ]]; then
            export TEST_SPEC='[tx]'
            export STELLAR_CORE_TEST_PARAMS="--ll fatal -r simple --all-versions --rng-seed 12345 --check-test-tx-meta ${PWD}/test-tx-meta-baseline-${{ matrix.protocol }}"
          fi
          
          ulimit -n 256
          make check

  # Final job to aggregate results
  complete:
    if: always()
    needs: [fmt, cargo-deny, rust-check-git-rev-deps, test]
    runs-on: ubuntu-22.04
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1